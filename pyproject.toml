[project]
name = "new-vesper"
version = "0.1.0"
description = "A persistent, shared, text-based RPG with an AI dungeon master."
requires-python = ">=3.12"
dependencies = ["anthropic>=1.8"]

[project.scripts]
new-vesper = "new_vesper.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["new_vesper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.setuptools.package-data]
"new_vesper.state" = ["migrations/*.sql"]
"new_vesper.content" = ["data/*.json"]
